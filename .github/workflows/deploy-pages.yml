name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Fix project-site asset paths
        run: |
          node --input-type=module - <<'NODE'
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const root = "dist/client";
          const assets = join(root, "assets");
          const rewrite = (file, replacements) => {
            let text = readFileSync(file, "utf8");
            for (const [from, to] of replacements) text = text.split(from).join(to);
            writeFileSync(file, text);
          };

          rewrite(join(root, "index.html"), [["/assets/", "./assets/"]]);
          for (const file of readdirSync(assets)) {
            if (file.endsWith(".js")) rewrite(join(assets, file), [["/assets/", "assets/"]]);
            if (file.endsWith(".css")) rewrite(join(assets, file), [["url(/assets/", "url("]]);
          }
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
